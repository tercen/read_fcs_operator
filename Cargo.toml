[package]
name = "read_fcs_operator"
version = "3.0.1"
edition = "2024"
description = "Read FCS files (2.0/3.0/3.1) into Tercen — Rust port of tercen/read_fcs_operator (R, flowCore)."
license = "Apache-2.0"
publish = false

[lib]
name = "read_fcs_operator"
path = "src/lib.rs"

# Production binary invoked by Tercen (--taskId / --serviceUri / --token).
[[bin]]
name = "read_fcs_operator"
path = "src/main.rs"

# Local development binary: TERCEN_URI / TERCEN_TOKEN / WORKFLOW_ID / STEP_ID.
[[bin]]
name = "dev"
path = "src/bin/dev.rs"

# Reader CLI used by the parity harness (meta | csv | bench).
[[bin]]
name = "fcsdump"
path = "src/bin/fcsdump.rs"

[dependencies]
# --- reader ---
anyhow = "1"
thiserror = "1"
byteorder = "1"
rayon = "1"
memmap2 = "0.9"
rand = "0.8"
rand_chacha = "0.3"
indexmap = "2"
encoding_rs = "0.8"
regex = "1"

# --- Tercen plumbing ---
tercen-rs = { git = "https://github.com/tercen/tercen-rs", branch = "main" }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "time"] }
tonic = "0.14"
futures = "0.3"
polars = { version = "0.51", default-features = false, features = ["lazy", "dtype-full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "0.6"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# Allocator: honours the task runner's MALLOC_CONF and returns freed memory to the OS (skill §5).
tikv-jemallocator = "0.6"

[dev-dependencies]
tempfile = "3"
# Only for the TSON writer byte-compatibility test.
rustson = { git = "https://github.com/tercen/rustson", branch = "master" }
# Only for the test that checks operator.json's spec against the emitted columns.
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
